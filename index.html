<!DOCTYPE html>
<html>
<head>
    <title>My First Web Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            margin-top: 100px;
        }

        h1 {
            color: blue;
        }

        p {
            color: #555;
            font-size: 18px;
        }

        button {
            background-color: green;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: darkgreen;
        }
    </style>
</head>
<body>

    <h1>Welcome to My Website</h1>
    <p>This is a simple HTML , CSS and Java Script.</p>

     <button onclick="showMessage()">Click Button</button>

    <script>
        function showMessage() {
            alert("Hello, Welcome to My Website!");
        }
    </script>

</body>
</html>
